[package]
name = "dalhin"
version = "0.1.0"
edition = "2021"
description = "Gestor de perfiles de Wine para Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/TU_USUARIO/dalhin"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
open = "5"
